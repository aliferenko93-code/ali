name: Build NeuroCam AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_payload/**'
      - '.github/workflows/build-neurocam.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct NeuroCam source
        shell: bash
        run: |
          cat build_payload/part*.b64 | tr -d '\r\n' | base64 -d > NeuroCamAI-source.zip
          unzip -t NeuroCamAI-source.zip
          unzip -q NeuroCamAI-source.zip
          test -f NeuroCamAI/app/build.gradle.kts

      - name: Build installable APK
        working-directory: NeuroCamAI
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp NeuroCamAI/app/build/outputs/apk/debug/app-debug.apk NeuroCamAI-1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCamAI-1.0-APK
          path: NeuroCamAI-1.0-debug.apk
          if-no-files-found: error
